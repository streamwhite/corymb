name: bunjs-hands-on

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_DOCKER_TAG: "1.3.10"
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env; see docker/env.example}
      SQLITE_PATH: /app/data/items.sqlite
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
